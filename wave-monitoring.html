<!-- Real-Time Wave Monitoring -->
<section class="wave-monitoring">
    <div class="container">
        <h2>Kondisi Ombak Real-Time</h2>
        <div class="wave-cards">
            <div class="wave-card">
                <div class="card-icon">
                    <i class="fas fa-water"></i>
                </div>
                <h3>Ketinggian Ombak</h3>
                <div class="wave-value" id="wave-height">1.2m</div>
                <p class="wave-desc">Cukup ideal untuk pemula</p>
            </div>
            <div class="wave-card">
                <div class="card-icon">
                    <i class="fas fa-wind"></i>
                </div>
                <h3>Kecepatan Angin</h3>
                <div class="wave-value" id="wind-speed">15 km/h</div>
                <p class="wave-desc">Angin sedang</p>
            </div>
            <div class="wave-card">
                <div class="card-icon">
                    <i class="fas fa-thermometer-half"></i>
                </div>
                <h3>Suhu Air</h3>
                <div class="wave-value" id="water-temp">28°C</div>
                <p class="wave-desc">Suhu nyaman</p>
            </div>
        </div>
        <div class="wave-chart-container">
            <canvas id="waveChart"></canvas>
        </div>
    </div>
</section>

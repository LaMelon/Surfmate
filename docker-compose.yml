version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: surfmate_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: surfmate_db
      DB_USER: surfmate_user
      DB_PASSWORD: surfmate_pass
    depends_on:
      - db
    volumes:
      - ./:/var/www/html

  db:
    image: mysql:8.0
    container_name: surfmate_db
    environment:
      MYSQL_DATABASE: surfmate_db
      MYSQL_USER: surfmate_user
      MYSQL_PASSWORD: surfmate_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
